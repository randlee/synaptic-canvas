name: Python Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: 'global.json'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run repo tests
        run: pytest tests/ -v

      # Separate invocation: tests/ and packages/*/tests are both packages
      # named "tests", so pytest cannot collect them together. Skipped on
      # Windows: these tests drive real git with bash-based gh stubs.
      - name: Run sc-gh-stack package tests
        if: runner.os != 'Windows'
        run: pytest packages/sc-gh-stack/tests -v

      # Harness unit tests only. NEVER point CI at test-packages/fixtures/ —
      # fixture tests (including the generated *-evals ones) execute live
      # Claude agent sessions and are run manually/by PQA, not in CI.
      - name: Run test-harness unit tests
        run: pytest harness/tests -v
        working-directory: test-packages
