name: Complete Validation Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pyyaml pydantic
      - name: Run version audit
        run: python3 scripts/audit-versions.py --verbose

  validate-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pyyaml pydantic
      - name: Validate agent registry
        run: python3 scripts/validate-agents.py

  validate-manifest-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pyyaml pydantic
      - name: Validate manifest artifacts
        run: python3 scripts/validate-manifest-artifacts.py

  validate-marketplace-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pyyaml pydantic
      - name: Validate marketplace synchronization
        run: python3 scripts/validate-marketplace-sync.py

  validate-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pyyaml pydantic
      - name: Validate frontmatter schema
        run: python3 scripts/validate-frontmatter-schema.py

  validate-cross-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pyyaml pydantic
      - name: Validate cross-references
        run: python3 scripts/validate-cross-references.py

  validate-script-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pyyaml pydantic
      - name: Validate script references
        run: python3 scripts/validate-script-references.py

  validate-hook-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pyyaml pydantic
      - name: Validate hook paths
        run: python3 scripts/validate-hook-paths.py

  validate-shared-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pyyaml pydantic
      - name: Validate shared scripts
        run: python3 scripts/validate-shared-scripts.py

  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Generate the build-artifact pages first (eval landing pages and the
      # announcements index are gitignored; pages.yml builds them the same way
      # at deploy time), then validate structure + internal links site-wide.
      - name: Generate site pages
        run: |
          python3 scripts/collect-eval-reports.py
          python3 scripts/generate-announcements-index.py
      - name: Validate site HTML and links
        run: python3 scripts/validate-site-html.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pyyaml pydantic
      - name: Run security scan
        run: python3 scripts/security-scan.py
