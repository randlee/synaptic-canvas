# sc-commit-push-pr package manifest
name: sc-commit-push-pr
version: 0.13.0
description: Commit, push, and create PRs for GitHub and Azure DevOps
author: randlee
license: MIT
tags:
  - git
  - pr
  - github
  - azure-devops
  - workflow

artifacts:
  skills:
    - skills/sc-commit-push-pr/SKILL.md
  agents:
    - agents/commit-push.md
    - agents/create-pr.md
  scripts:
    - scripts/envelope.py
    - scripts/sc_shared.py
    - scripts/provider_detect.py
    - scripts/pr_provider.py
    - scripts/preflight_utils.py
    - scripts/stack_guard.py
    - scripts/commit_push_agent_start_hook.py
    - scripts/create_pr_agent_start_hook.py
    - scripts/commit_pull_merge_commit_push.py
    - scripts/create_pr.py

# Hard runtime dependency: sc-commit-push-pr is the critical junction where
# a stack-unaware commit/pull/merge/push or PR creation can corrupt gh-stack
# linearity, so the gh-stack toolchain is required unconditionally -- on
# every branch, and for every provider (including Azure DevOps-hosted
# repos). See scripts/stack_guard.py::check_stack_prerequisites().
dependencies:
  - "sc-gh-stack >= 0.2.0"

requires:
  - python3
  - pydantic
  - pyyaml
  - git
  - gh                          # required unconditionally, not just for GitHub PRs
  - gh-stack extension          # `gh extension install github/gh-stack` -- required unconditionally
  - managing-gh-stacks skill    # from the sc-gh-stack package -- required unconditionally
