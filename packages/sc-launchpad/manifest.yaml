name: sc-launchpad
version: 0.14.3
description: >
  Launch Claude (including Fable), Codex (including Astra, Sol, Terra, and Luna), or
  Gemini as a separate background
  sub-agent runtime, with explicit ATM teammate-mode normalization and roster
  registration.
author: synaptic-canvas
license: MIT
tags:
  - background-agents
  - claude
  - codex
  - sol
  - terra
  - luna
  - gemini
  - fable
  - atm

artifacts:
  skills:
    - skills/launchpad/SKILL.md
  agents:
    - agents/launchpad.md
  scripts:
    - scripts/agent_identity.py
    - scripts/agent_models.py
    - scripts/launchpad_commands.py
    - scripts/launchpad_env.py
    - scripts/launchpad_models.py
    - scripts/launchpad_output.py
    - scripts/launchpad_process.py
    - scripts/launchpad_shared.py
    - scripts/sc_launchpad_task.py

shared_scripts:
  - source: packages/shared/scripts/agent_identity.py
    target: scripts/agent_identity.py
  - source: packages/shared/scripts/agent_models.py
    target: scripts/agent_models.py
  - source: packages/shared/scripts/launchpad_shared.py
    target: scripts/launchpad_shared.py

requires:
  cli:
    - python3
    - claude
    - codex
    - gemini
  python:
    - pydantic
