name: sc-launch-term
version: 0.12.0
description: >
  Launch Claude (including Fable), Codex (including Sol, Terra, and Luna), and
  Gemini sessions in supported terminals with platform-aware autodetect, cmux
  workspace tabs, and optional tmux session management.
author: randlee
license: MIT
tags:
  - terminal
  - launcher
  - macos
  - windows
  - tmux
  - cmux
  - claude
  - fable
  - codex
  - sol
  - terra
  - luna
  - gemini

artifacts:
  commands:
    - commands/sc/sonnet.md
    - commands/sc/haiku.md
    - commands/sc/opus.md
    - commands/sc/fable.md
    - commands/sc/sol.md
    - commands/sc/terra.md
    - commands/sc/luna.md
    - commands/sc/codex.md
    - commands/sc/gemini.md
  scripts:
    - scripts/launch_term_shared.py
    - scripts/sc-term-launch.sh
    - scripts/sc-term-launch.py

requires:
  cli:
    - Python 3 launcher on PATH (`python3`, `py -3`, or `python`)
