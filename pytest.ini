[pytest]
markers =
    integration: requires external services or tokens

testpaths = tests packages/sc-docling-pdf/tests packages/sc-gh-stack/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude test-packages from automated runs (manual plugin testing only)
norecursedirs = test-packages .git __pycache__ .tox .eggs *.egg .venv venv

# Default options - can be overridden on command line
# --import-mode=importlib avoids basename collisions between packages that
# share a module name (e.g. tests/ and packages/*/tests/ are both "tests").
addopts = -v --tb=short --import-mode=importlib
